<svg width="760" height="420" viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36BCF7"/>
      <stop offset="100%" stop-color="#79A500"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', 'Fira Code', monospace; fill: #c9d1d9; }
      .label { font-size: 15px; font-weight: 600; }
      .pct   { font-size: 13px; fill: #8b949e; }
      .track { fill: #21262d; rx: 6; }
    </style>
  </defs>

  <rect width="760" height="420" fill="none"/>

  <!-- Row template repeated with different y, width target, delay -->
  <!-- 1: .NET & Clean Architecture 100% -->
  <text x="0" y="20" class="label">.NET &amp; Clean Architecture</text>
  <text x="700" y="20" class="pct">100%</text>
  <rect x="0" y="30" width="760" height="12" rx="6" class="track"/>
  <rect x="0" y="30" height="12" rx="6" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="760" dur="1.4s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>

  <!-- 2: Backend Engineering 100% -->
  <text x="0" y="70" class="label">Backend Engineering</text>
  <text x="700" y="70" class="pct">100%</text>
  <rect x="0" y="80" width="760" height="12" rx="6" class="track"/>
  <rect x="0" y="80" height="12" rx="6" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="760" dur="1.4s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>

  <!-- 3: REST API Development 100% -->
  <text x="0" y="120" class="label">REST API Development</text>
  <text x="700" y="120" class="pct">100%</text>
  <rect x="0" y="130" width="760" height="12" rx="6" class="track"/>
  <rect x="0" y="130" height="12" rx="6" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="760" dur="1.4s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>

  <!-- 4: SQL & Database Engineering 90% -->
  <text x="0" y="170" class="label">SQL &amp; Database Engineering</text>
  <text x="700" y="170" class="pct">90%</text>
  <rect x="0" y="180" width="760" height="12" rx="6" class="track"/>
  <rect x="0" y="180" height="12" rx="6" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="684" dur="1.4s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>

  <!-- 5: React & Full Stack 80% -->
  <text x="0" y="220" class="label">React &amp; Full Stack</text>
  <text x="700" y="220" class="pct">80%</text>
  <rect x="0" y="230" width="760" height="12" rx="6" class="track"/>
  <rect x="0" y="230" height="12" rx="6" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="608" dur="1.4s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>

  <!-- 6: Generative AI 75% -->
  <text x="0" y="270" class="label">Generative AI</text>
  <text x="700" y="270" class="pct">75%</text>
  <rect x="0" y="280" width="760" height="12" rx="6" class="track"/>
  <rect x="0" y="280" height="12" rx="6" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="570" dur="1.4s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>

  <!-- 7: Cloud & DevOps 65% -->
  <text x="0" y="320" class="label">Cloud &amp; DevOps</text>
  <text x="700" y="320" class="pct">65%</text>
  <rect x="0" y="330" width="760" height="12" rx="6" class="track"/>
  <rect x="0" y="330" height="12" rx="6" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="494" dur="1.4s" begin="1.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>

  <!-- 8: AI Agents 50% -->
  <text x="0" y="370" class="label">AI Agents</text>
  <text x="700" y="370" class="pct">50%</text>
  <rect x="0" y="380" width="760" height="12" rx="6" class="track"/>
  <rect x="0" y="380" height="12" rx="6" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="380" dur="1.4s" begin="1.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>
</svg>
